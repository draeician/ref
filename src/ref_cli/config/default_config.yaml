# Optional ref-api base URL (e.g. http://192.168.1.10:8000). When set, `ref <url>` and
# `ref --search` (and field-specific search flags) call the API instead of local files.
# Override with env REF_API_URL.
api_url: null
paths:
  references: ~/references
  transcripts: ~/references/transcripts
  # Full meta cards (YouTube videos/channels, later other platforms)
  enrichment: ~/references/enrichment
removable_keys:
  - utm_source
  - utm_medium
  - utm_campaign
  - utm_term
  - utm_content
  - fbclid
  - gclid
  - _ga
# For Rumble 403: set to browser name (e.g. firefox, chrome) to use its cookies with yt-dlp.
# Some systems require the browser to be closed when using this. Env override: REF_RUMBLE_COOKIES_BROWSER
rumble_cookies_from_browser: null
# YouTube transcript retrieval:
#   remote_first (default) — try captions remotely, then queue for local transcription.
#   local_only — never call youtube-transcript-api; reuse on-disk JSON or queue locally.
# Env override: REF_YOUTUBE_TRANSCRIPT_MODE
youtube_transcript_mode: remote_first

# Durable local-transcribe queue (optional). Absolute paths only.
# When the Python package is unavailable, ref invokes `lt queue add --queue-dir`.
# Env overrides: REF_LOCAL_TRANSCRIBE_LT, REF_LOCAL_TRANSCRIBE_QUEUE_DIR,
#                REF_LOCAL_TRANSCRIBE_QUEUE_UUID
local_transcribe_lt: null
local_transcribe_queue_dir: null
local_transcribe_queue_uuid: null

skip_patterns:
  # URLs to skip during processing (exact matches or glob patterns)
  # Examples:
  # - https://mail.google.com/*  # Skip all Gmail URLs (glob pattern)
  # - https://mail.google.com/mail/u/0  # Skip specific URL (exact match)
  # Add your skip patterns below: 