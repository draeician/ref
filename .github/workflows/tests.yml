name: tests

on:
  # Keep the issue-15 fix loop green on its own branch as well as on any PR.
  push:
    branches:
      - fix/issue-15-ref-api-disconnect
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package with test and API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,test]"

      - name: Run the repository's pytest suite
        run: python -m pytest -q
